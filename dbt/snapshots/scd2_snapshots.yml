version: 2

snapshots:
  - name: snap_dim_site
    relation: ref('stg_dim_site')
    description: >
      Type-2 history for the site dimension. Tracks ownership model, offer mix,
      new-energy fit-out and operating status over time, so a margin trend can
      be read against the site as it actually was, not as it is now.
    config:
      database: "{{ env_var('VIVO_CATALOG', 'vivo_dev') }}"
      schema: silver_snapshots
      unique_key: site_id
      strategy: check
      check_cols:
        - site_name
        - site_type
        - ownership_model
        - site_status
        - has_convenience
        - has_qsr
        - has_ev_charging
        - has_solar
        - has_lpg
        - forecourt_lanes
      invalidate_hard_deletes: true

  - name: snap_dim_customer
    relation: ref('stg_dim_customer')
    description: >
      Type-2 history for customers. Credit band and limit changes are the
      audit trail behind any credit-exposure question.
    config:
      database: "{{ env_var('VIVO_CATALOG', 'vivo_dev') }}"
      schema: silver_snapshots
      unique_key: customer_id
      strategy: check
      check_cols:
        - customer_name
        - sector
        - segment
        - credit_band
        - credit_limit_zar
        - payment_terms_days
        - is_active
      invalidate_hard_deletes: true

  - name: snap_dim_product
    relation: ref('stg_dim_product')
    description: >
      Type-2 history for products, principally to retain the base price and
      cost that applied in a given period.
    config:
      database: "{{ env_var('VIVO_CATALOG', 'vivo_dev') }}"
      schema: silver_snapshots
      unique_key: product_id
      strategy: check
      check_cols:
        - product_name
        - category
        - subcategory
        - brand
        - base_price_zar
        - base_cost_zar
        - regulated

  - name: snap_dim_contract
    relation: ref('stg_dim_contract')
    description: >
      Type-2 history for commercial contracts. Discount and committed-volume
      changes drive the contract-compliance reporting.
    config:
      database: "{{ env_var('VIVO_CATALOG', 'vivo_dev') }}"
      schema: silver_snapshots
      unique_key: contract_id
      strategy: check
      check_cols:
        - contract_type
        - end_date
        - committed_volume_litres
        - price_mechanism
        - discount_cents_per_litre
